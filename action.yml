name: 'Add PR git trailers'
description: 'Add PR, Reviewed-by and Approved-by trailers in git commits of a PR'

inputs:
  pr-number:
    description: >
      Number identifying the pull request to process. Defaults to the current
      pull request number when used from a pull request event context.
    required: false
  user-info:
    description: >
      Filepath to .yaml file with user info (GitHub username, name, email)
    required: false
  token:
    description: >
      Access token used to fetch the repository and perform gh operations
    default: ${{ github.token }}
  check-only:
    description: 'Whether to only check if the required trailers exist'
    default: false
  fail-on-missing:
    description: 'Whether to fail if the required trailers are missing'
    default: false
  exclude-reviewers:
    description: >
      Comma-separated list of GitHub logins to exclude from reviewer trailers
    default: 'github-actions,github-advanced-security'

outputs:
  has-trailers:
    description: 'Whether the specified PR has the required trailers or not'
    value: >-
      ${{ steps.update-commits.outputs.has-trailers ||
        steps.check-trailers.outputs.has-trailers }}

runs:
  using: 'composite'
  steps:
  - name: Get PR info
    id: get-pr-info
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
      GH_TOKEN: ${{ inputs.token }}
    run: |
      pr_info=$(gh pr view "${PR_NUMBER}" \
        --repo "${REPO}" \
        --json author,headRefName,baseRefName,url,commits)

      author=$(jq -r '.author.login' <<< "$pr_info" |
        sed 's/\[bot\]//g' | sed 's/app\///g')
      head_ref=$(jq -r '.headRefName' <<< "$pr_info")
      base_ref=$(jq -r '.baseRefName' <<< "$pr_info")
      url=$(jq -r '.url' <<< "$pr_info")
      commits=$(jq -r '.commits[].oid' <<< "$pr_info")

      pr_reviews=$(gh api \
        "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
        --paginate)

      reviewers=$(jq -r '[.[].user.login] | unique | .[]' <<< "$pr_reviews" |
        sed 's/\[bot\]//g')
      approvers=$(jq -r '
        [map(select(.state == "APPROVED"))[].user.login] | unique | .[]
      ' <<< "$pr_reviews" | sed 's/\[bot\]//g')

      {
        echo "author=${author}"
        echo "head-ref=${head_ref}"
        echo "base-ref=${base_ref}"
        echo "url=${url}"
        echo 'commits<<EOF'
        echo "$commits"
        echo 'EOF'
        echo 'reviewers<<EOF'
        echo "$reviewers"
        echo 'EOF'
        echo 'approvers<<EOF'
        echo "$approvers"
        echo 'EOF'
        echo "checkout-path=.add-git-trailers-pr-${PR_NUMBER}"
      } >> "$GITHUB_OUTPUT"

      echo "PR: ${PR_NUMBER}"
      echo "URL: ${url}"
      echo "Author: ${author}"
      echo "Head ref: ${head_ref}"
      echo "Base ref: ${base_ref}"
      printf 'Commits:\n%s\n' "${commits}"
      printf 'Reviewers:\n%s\n' "${reviewers}"
      printf 'Approvers:\n%s\n' "${approvers}"
    shell: bash

  - name: Set user-info file
    id: set-file
    if: inputs.check-only == 'false'
    env:
      USER_INFO: ${{ inputs.user-info }}
    run: |
      TEMP_USER_INFO="${RUNNER_TEMP}/user_info.yml"
      if [[ -n "$USER_INFO" ]]; then
        echo "Using ${USER_INFO} for user info"
        cp "$USER_INFO" "$TEMP_USER_INFO"
      else
        echo "Using default file for user info"
        cp "${GITHUB_ACTION_PATH}/resources/user_info.yml" \
          "$TEMP_USER_INFO"
      fi
      echo "user-info-path=${TEMP_USER_INFO}" >> "$GITHUB_OUTPUT"
    shell: bash

  - name: Checkout head ref
    uses: actions/checkout@v6
    with:
      ref: ${{ steps.get-pr-info.outputs.head-ref }}
      fetch-depth: 0
      path: ${{ steps.get-pr-info.outputs.checkout-path }}
      token: ${{ inputs.token }}

  - name: Check trailers
    id: check-trailers
    working-directory: ${{ steps.get-pr-info.outputs.checkout-path }}
    env:
      COMMITS: ${{ steps.get-pr-info.outputs.commits }}
      FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
    run: |
      required=(
        "PR"
        "Reviewed-by"
        "Approved-by"
      )

      has_trailers=true
      for sha in $COMMITS; do
        msg=$(git show -s --format=%B "$sha")
        trailers=$(echo "$msg" | git interpret-trailers --no-divider --parse)

        for r in "${required[@]}"; do
          if ! echo "$trailers" | grep -Eiq "^${r}:[[:space:]]+.+$"; then
            echo "Commit ${sha} missing required trailer: ${r}"
            has_trailers=false
          fi
        done
      done
      echo "has-trailers=${has_trailers}" >> "$GITHUB_OUTPUT"
      echo "PR has required trailers: ${has_trailers}"

      if [[ "$FAIL_ON_MISSING" == 'true' ]] &&
        [[ "$has_trailers" == 'false' ]]; then
        echo "::error::Required trailers missing"
        exit 1
      fi
    shell: bash

  - name: Setup yq
    if: >-
      inputs.check-only == 'false' &&
      steps.check-trailers.outputs.has-trailers == 'false'
    uses: dcarbone/install-yq-action@v1
    with:
      version: 'v4.52.2'

  - name: Generate Reviewed-by trailer strings
    id: generate-reviewer-trailers
    if: >-
      inputs.check-only == 'false' &&
      steps.check-trailers.outputs.has-trailers == 'false'
    env:
      PR_AUTHOR: ${{ steps.get-pr-info.outputs.author }}
      PR_REVIEWERS: ${{ steps.get-pr-info.outputs.reviewers }}
      USER_INFO_PATH: ${{ steps.set-file.outputs.user-info-path }}
      EXCLUDE_REVIEWERS: ${{ inputs.exclude-reviewers }}
    run: |
      excluded=$(tr ',' '\n' <<< "$EXCLUDE_REVIEWERS" | sed 's/\[bot\]//g' |
        sed '/^$/d')
      trailers=()
      for i in $PR_REVIEWERS; do \
        # Skip PR author and specified reviewers
        if [[ "$i" == "$PR_AUTHOR" ]] || grep -qx "$i" <<< "$excluded"; then
          echo "Skipping reviewer '${i}'"
          continue
        fi

        gh_user=$(key="$i" yq '.users.[strenv(key)]' "$USER_INFO_PATH")
        if [[ "$gh_user" == "null" ]]; then
          gh_user=$(name="${i}[bot]" \
            yq '.users.* | select(.name == strenv(name))' "$USER_INFO_PATH")
        fi

        if [[ -z "$gh_user" ]] || [[ "$gh_user" == "null" ]]; then
          echo "::error::Reviewer '${i}' not found in user-info file"
          exit 1
        fi

        gh_user_name=$(yq '.name' <<< "$gh_user")
        gh_user_email=$(yq '.email' <<< "$gh_user")
        trailers+=("review: ${gh_user_name} <${gh_user_email}>")
        echo "Reviewer '$i' is '${gh_user_name} <${gh_user_email}>'"
      done

      if [[ ${#trailers[@]} -eq 0 ]]; then
        echo "::error::No reviewer trailers generated"
        exit 1
      fi

      trailers_json=$(jq -nc '$ARGS.positional' --args "${trailers[@]}")
      echo "reviewer-trailers=${trailers_json}" >> "$GITHUB_OUTPUT"
      echo "Reviewer trailers: ${trailers_json}"
    shell: bash

  - name: Generate Approved-by trailer strings
    id: generate-approver-trailers
    if: >-
      inputs.check-only == 'false' &&
      steps.check-trailers.outputs.has-trailers == 'false'
    env:
      PR_AUTHOR: ${{ steps.get-pr-info.outputs.author }}
      PR_APPROVERS: ${{ steps.get-pr-info.outputs.approvers }}
      USER_INFO_PATH: ${{ steps.set-file.outputs.user-info-path }}
    run: |
      trailers=()
      for i in $PR_APPROVERS; do \
        # Skip PR author
        if [[ "$i" == "$PR_AUTHOR" ]]; then
          echo "Skipping approver '${i}' (PR author)"
          continue
        fi

        gh_user=$(key="$i" yq '.users.[strenv(key)]' "$USER_INFO_PATH")
        if [[ "$gh_user" == "null" ]]; then
          gh_user=$(name="${i}[bot]" \
            yq '.users.* | select(.name == strenv(name))' "$USER_INFO_PATH")
        fi

        if [[ -z "$gh_user" ]] || [[ "$gh_user" == "null" ]]; then
          echo "::error::Approver '${i}' not found in user-info file"
          exit 1
        fi

        gh_user_name=$(yq '.name' <<< "$gh_user")
        gh_user_email=$(yq '.email' <<< "$gh_user")
        trailers+=("approve: ${gh_user_name} <${gh_user_email}>")
        echo "Approver '$i' is '${gh_user_name} <${gh_user_email}>'"
      done

      if [[ ${#trailers[@]} -eq 0 ]]; then
        echo "::error::No approver trailers generated"
        exit 1
      fi

      trailers_json=$(jq -nc '$ARGS.positional' --args "${trailers[@]}")
      echo "approver-trailers=${trailers_json}" >> "$GITHUB_OUTPUT"
      echo "Approver trailers: ${trailers_json}"
    shell: bash

  - name: Update PR commits with trailers
    id: update-commits
    if: >-
      inputs.check-only == 'false' &&
      steps.check-trailers.outputs.has-trailers == 'false'
    working-directory: ${{ steps.get-pr-info.outputs.checkout-path }}
    env:
      PR_URL: ${{ steps.get-pr-info.outputs.url }}
      PR_AUTHOR: ${{ steps.get-pr-info.outputs.author }}
      USER_INFO_PATH: ${{ steps.set-file.outputs.user-info-path }}
      BASE_REF: ${{ steps.get-pr-info.outputs.base-ref }}
      HEAD_REF: ${{ steps.get-pr-info.outputs.head-ref }}
      REVIEWER_TRAILERS: >-
        ${{ steps.generate-reviewer-trailers.outputs.reviewer-trailers }}
      APPROVER_TRAILERS: >-
        ${{ steps.generate-approver-trailers.outputs.approver-trailers }}
    run: |
      echo 'Preparing git environment'
      git config trailer.sign.key "Signed-off-by"
      git config trailer.review.key "Reviewed-by"
      git config trailer.approve.key "Approved-by"
      git config trailer.pr.key "PR"
      git config trailer.pr.where "start"

      gh_user=$(key="$PR_AUTHOR" yq '.users.[strenv(key)]' "$USER_INFO_PATH")
      if [[ "$gh_user" == "null" ]]; then
        gh_user=$(name="${PR_AUTHOR}[bot]" \
          yq '.users.* | select(.name == strenv(name))' "$USER_INFO_PATH")
      fi

      if [[ -z "$gh_user" ]] || [[ "$gh_user" == "null" ]]; then
        echo "::error::PR author '${PR_AUTHOR}' not found in user-info file"
        exit 1
      fi

      gh_user_name=$(yq '.name' <<< "$gh_user")
      gh_user_email=$(yq '.email' <<< "$gh_user")
      git config user.email "$gh_user_email"
      git config user.name "$gh_user_name"
      echo "Configured '${gh_user_name} <${gh_user_email}>' as committer"

      echo 'Generating actual trailers'
      trailer_args=$(jq -rn \
        --arg pr "$PR_URL" \
        --argjson r "$REVIEWER_TRAILERS" \
        --argjson a "$APPROVER_TRAILERS" \
        '["pr: \($pr)"] + $r + $a | map("--trailer " + @sh) | join(" ")')

      echo 'Adding trailers'
      git rebase "origin/${BASE_REF}" \
        -x "git commit --amend --allow-empty --no-edit ${trailer_args}"

      echo "Pushing to origin/${HEAD_REF}"
      git push --force-with-lease origin "${HEAD_REF}"

      echo 'has-trailers=true' >> "$GITHUB_OUTPUT"
      echo 'Successfully added trailers'
    shell: bash

  - name: Cleanup
    if: always()
    env:
      CHECKOUT_PATH: ${{ steps.get-pr-info.outputs.checkout-path }}
    run: rm -rf "$CHECKOUT_PATH"
    shell: bash
