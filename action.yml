name: git-trailers
description: "Action that adds Reviewed-by/Approved-by and PR trailers in git commits of a PR"

inputs:
  user_info:
    description: "Filepath to .yaml file with user info (github username, name, email)"
    required: false

  rebase_branch:
    description: "The branch to rebase against"
    required: false

runs:
    using: 'composite'
    steps:
#    - name: Debug github events
#      id: tmp
#      shell: bash
#      run: |
#        echo "github.head_ref:" ${{ github.head_ref}}
#        echo "github.ref:" ${{ github.ref }}
#        echo "github.ref_name:" ${{ github.ref_name }}
#        echo "github.event.number:" ${{ github.event.number }}
#        echo "github.event.pull_request.base.ref:" ${{ github.event.pull_request.base.ref }}
#        echo "github.event.pull_request.head.ref:" ${{ github.event.pull_request.head.ref }}
#        echo "github.event.pull_request.number:" ${{ github.event.pull_request.number }}

    - name: 'Setup yq'
      uses: dcarbone/install-yq-action@v1.1.1
      with:
        version: v4.40.5

    - name: Parse inputs
      shell: bash
      env:
        INPUT_USER_INFO: ${{ inputs.user_info }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_USER_INFO" ]; then
          USER_INFO=$(base64 -w 0 < "$INPUT_USER_INFO")
        else
          USER_INFO=$(base64 -w 0 < "${ACTION_PATH}/resources/users_info.yml")
        fi
        echo "user_info=$USER_INFO" >> "$GITHUB_ENV"

    - name: Get PR info
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail

        echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_ENV"

        pr_info=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
        pr_user=$(echo "$pr_info" | jq -r '.user.login')
        echo "pr_user=$pr_user" >> "$GITHUB_ENV"
        echo "Pull request user: $pr_user"

        pr_commits=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" | jq -r '.[].sha')
        {
          echo 'PR_COMMITS_GHENV<<EOF'
          echo "$pr_commits"
          echo 'EOF'
        } >> "$GITHUB_ENV"

        pr_reviews=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")
        pr_reviewers=$(echo "$pr_reviews" | jq -r 'map(.user.login) | unique | .[]')
        {
          echo 'PR_REVIEWERS_GHENV<<EOF'
          echo "$pr_reviewers"
          echo 'EOF'
        } >> "$GITHUB_ENV"
        echo "Pull reviewers: $pr_reviewers"

        pr_approvers=$(echo "$pr_reviews" | jq -r 'map(select(.state == "APPROVED")) | map(.user.login) | unique | .[]')
        {
          echo 'PR_APPROVER_GHENV<<EOF'
          echo "$pr_approvers"
          echo 'EOF'
        } >> "$GITHUB_ENV"
        echo "Pull request approvers: $pr_approvers"

    - name: Generate trailer strings
      shell: bash
      run: |
        set -euo pipefail

        lookup_user_field() {
          local username="$1" field="$2"
          echo "${{ env.user_info }}" | base64 -d | yq ".users.${username}.${field}" -
        }

        validate_user() {
          local username="$1"
          local gh_user
          gh_user=$(echo "${{ env.user_info }}" | base64 -d | yq ".users.${username}" -)
          if [[ "$gh_user" == "null" ]]; then
            echo "ERROR: user '$username' not found in users info resource file"
            exit 1
          fi
        }

        echo "Author was $pr_user"
        # Generate reviewer trailers
        reviewer_trailers=()
        for reviewer in $PR_REVIEWERS_GHENV; do
          # Skip PR author and github-actions bot
          if [[ "$reviewer" == "$pr_user" || "$reviewer" == "github-actions"* ]]; then
            continue
          fi
          echo "Checking reviewer: $reviewer"
          validate_user "$reviewer"
          name=$(lookup_user_field "$reviewer" "name")
          email=$(lookup_user_field "$reviewer" "email")
          reviewer_trailers+=("review: ${name} <${email}>")
        done

        # Generate approver trailers
        approver_trailers=()
        for approver in $PR_APPROVER_GHENV; do
          echo "Checking approver: $approver"
          validate_user "$approver"
          name=$(lookup_user_field "$approver" "name")
          email=$(lookup_user_field "$approver" "email")
          approver_trailers+=("approve: ${name} <${email}>")
        done

        # Fail if no reviewers or approvers
        if [[ ${#reviewer_trailers[@]} -eq 0 ]]; then
          echo "ERROR: No reviewers found for this PR"
          exit 1
        fi
        if [[ ${#approver_trailers[@]} -eq 0 ]]; then
          echo "ERROR: No approvers found for this PR"
          exit 1
        fi

        # Export as JSON arrays
        reviewer_json=$(jq -c -n '$ARGS.positional' --args "${reviewer_trailers[@]+"${reviewer_trailers[@]}"}")
        approver_json=$(jq -c -n '$ARGS.positional' --args "${approver_trailers[@]+"${approver_trailers[@]}"}")
        echo "reviewer_trailers=${reviewer_json}" >> "$GITHUB_ENV"
        echo "approver_trailers=${approver_json}" >> "$GITHUB_ENV"
        echo "reviewer_trailers=$reviewer_json"
        echo "approver_trailers=$approver_json"

    - name: Update remote branch with trailer info
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BRANCH_TO_REBASE: ${{ github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail

        echo "Preparing git environment"
        git fetch origin "${{ env.target_branch }}"
        git status
        git config trailer.sign.key "Signed-off-by"
        git config trailer.review.key "Reviewed-by"
        git config trailer.approve.key "Approved-by"
        git config trailer.pr.key "PR"
        git config trailer.pr.where "start"

        echo "Setting up user"
        pr_user_check=$(echo "${{ env.user_info }}" | base64 -d | yq ".users.${pr_user}" -)
        if [[ "$pr_user_check" == "null" ]]; then
          echo "ERROR: PR author '$pr_user' not found in users info resource file"
          exit 1
        fi
        gh_user_name=$(echo "${{ env.user_info }}" | base64 -d | yq ".users.${pr_user}.name" -)
        gh_user_email=$(echo "${{ env.user_info }}" | base64 -d | yq ".users.${pr_user}.email" -)
        git config user.email "$gh_user_email"
        git config user.name "$gh_user_name"

        # Build the exec command for rebase -x
        pr_url="https://github.com/${REPOSITORY}/pull/${PR_NUMBER}"
        exec_cmd="git commit --amend --allow-empty --no-edit --trailer 'pr: ${pr_url}'"

        trailers_json=$(echo -e "${reviewer_trailers}\n${approver_trailers}" | jq -s 'add // []')
        IFS=$'\n'
        for trailer in $(echo "$trailers_json" | jq -c -r '.[]'); do
          [ -n "$trailer" ] && exec_cmd+=" --trailer '${trailer}'"
        done
        unset IFS

        echo "Adding trailers via rebase"
        echo "exec_cmd: $exec_cmd"
        git rebase origin/main -x "$exec_cmd"

        echo "Pushing to origin/${BRANCH_TO_REBASE}"
        git push -f origin "${BRANCH_TO_REBASE}"
